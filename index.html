<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自我介绍</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .avatar {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            object-fit: cover;
            display:block;
            margin:0 auto;
        }

        .info{
            text-align: center;
            color: #666;
            font-size:16px;
            margin-bottom:20px;
        }
        .title{
            text-align: center;
            color: #666;
            font-size:18px;
            margin-bottom:30px;
        }
        .section{
            margin:25px 0;
        }
        h2{
            border-left:4px solid #409eff;
            padding-left:10px;
            color:#222;
        }
        .tag-list{
            display:flex;
            gap:10px;
            flex-wrap:wrap;
            margin-top:10px;
        }
        .tag{
            padding:4px 12px;
            background-color:#e8f4ff;
            color:#409eff;
            border-radius:20px;
        }
        footer{
            text-align:center;
            margin-top:40px;
            color:#888;
        }
    </style>
</head>
<body>
    <div class="card">
        <img class="avatar" src="avatar.jpg" alt="头像">
        <h1 style="font-family:Microsoft YaHei;">沈奇韬</h1>
        <div class="info">家乡：肇庆 职业：前端学习者</div>
        <div class="title">一名热爱生活的人</div>

        <div class="section">
            <h2>关于我</h2>
            <p>你好！我是一个对世界充满好奇心的人。做事踏实认真，愿意不断学习提升自己，乐于尝试新鲜事物，善于沟通交流。</p>
        </div>

        <div class="section">
            <h2>兴趣爱好</h2>
            <div class="tag-list">
                <span class="tag">游戏</span>
                <span class="tag">运动</span>
                <span class="tag">音乐</span>
                <span class="tag">旅行</span>
            </div>
        </div>

        <div class="section">
            <h2>我的目标</h2>
            <p>希望持续学习专业知识，不断提升能力，脚踏实地，遇见更好的自己。</p>
        </div>

        <footer>很高兴认识你✨</footer>
    </div>
</body>
</html>
